name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.paths.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        uses: kellen-miller/ci/.github/actions/changed-paths@6d83b6c0e8b6f407fa2f11e1c974449649cfa1f6
        with:
          filters: |
            {
              "go": [
                ".github/workflows/**",
                ".github/actions/**",
                "go.mod",
                "go.sum",
                "go.work",
                "go.work.sum",
                "**/*.go",
                "cmd/**",
                "internal/**",
                "pkg/**",
                "testdata/**",
                "fixtures/**",
                "scripts/**",
                ".golangci*",
                "Taskfile*",
                "Makefile"
              ],
              "release": [
                ".github/workflows/**",
                ".github/actions/**",
                "go.mod",
                "go.sum",
                "go.work",
                "go.work.sum",
                "**/*.go",
                "cmd/**",
                "internal/**",
                "pkg/**",
                "testdata/**",
                "fixtures/**",
                "scripts/**",
                ".golangci*",
                "Taskfile*",
                "Makefile",
                "release.config.cjs",
                ".goreleaser*",
                "package*.json",
                "LICENSE",
                "README.md"
              ]
            }

  go-lint:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).go) }}
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/go-lint@6d83b6c0e8b6f407fa2f11e1c974449649cfa1f6
        with:
          go-version-file: go.mod
          vulnerability-check: 'false'

  govulncheck:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).go) }}
    name: Go vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  github-actions-lint:
    name: GitHub Actions lint
    uses: kellen-miller/ci/.github/workflows/gh-actions-lint.yaml@6d83b6c0e8b6f407fa2f11e1c974449649cfa1f6

  pull-request-title:
    name: Conventional pull request title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate pull request title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  release-config:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).release) }}
    name: Release configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      - name: Load semantic-release configuration
        run: node -e 'require("./release.config.cjs")'
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).go) }}
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    uses: kellen-miller/ci/.github/workflows/go-test.yaml@6d83b6c0e8b6f407fa2f11e1c974449649cfa1f6
    with:
      runner: ${{ matrix.os }}
      go-version-file: go.mod

  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.changes).go) }}
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -trimpath ./cmd/gctx

name: gctx

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: CI-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gctx-paths:
    name: gctx / Changed paths
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.paths.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: paths
        uses: kellen-miller/ci/.github/actions/changed-paths@6d83b6c0e8b6f407fa2f11e1c974449649cfa1f6
        with:
          filters: |
            {
              "go": [
                ".github/workflows/**",
                ".github/actions/**",
                "go.mod",
                "go.sum",
                "go.work",
                "go.work.sum",
                "**/*.go",
                "cmd/**",
                "internal/**",
                "pkg/**",
                "testdata/**",
                "fixtures/**",
                "scripts/**",
                ".golangci*",
                "Taskfile*",
                "Makefile"
              ],
              "release": [
                ".github/workflows/**",
                ".github/actions/**",
                "go.mod",
                "go.sum",
                "go.work",
                "go.work.sum",
                "**/*.go",
                "cmd/**",
                "internal/**",
                "pkg/**",
                "testdata/**",
                "fixtures/**",
                "scripts/**",
                ".golangci*",
                "Taskfile*",
                "Makefile",
                "release.config.cjs",
                ".goreleaser*",
                "package*.json",
                "LICENSE",
                "README.md"
              ]
            }

  go-static-analysis:
    name: Go / Static analysis
    needs: gctx-paths
    if: ${{ !cancelled() && (needs.gctx-paths.result != 'success' || fromJSON(needs.gctx-paths.outputs.changes).go) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/go-lint@6d83b6c0e8b6f407fa2f11e1c974449649cfa1f6
        with:
          go-version-file: go.mod
          vulnerability-check: 'false'

  go-vulnerability-analysis:
    name: Go / Vulnerability analysis
    needs: gctx-paths
    if: ${{ !cancelled() && (needs.gctx-paths.result != 'success' || fromJSON(needs.gctx-paths.outputs.changes).go) }}
    runs-on: ubuntu-latest
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  release-config-validation:
    name: Release / Configuration validation
    needs: gctx-paths
    if: ${{ !cancelled() && (needs.gctx-paths.result != 'success' || fromJSON(needs.gctx-paths.outputs.changes).release) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      - name: Load semantic-release configuration
        run: node -e 'require("./release.config.cjs")'
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  go-package-tests:
    name: Go
    needs: gctx-paths
    if: ${{ !cancelled() && (needs.gctx-paths.result != 'success' || fromJSON(needs.gctx-paths.outputs.changes).go) }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    uses: kellen-miller/ci/.github/workflows/go-test.yaml@c188397b9147dbf21030cf2f3e4fc41bff37358b
    with:
      check-name: Package tests (${{ matrix.os }})
      runner: ${{ matrix.os }}
      go-version-file: go.mod

  build-cli:
    name: Go / Build CLI (${{ matrix.os }})
    needs: gctx-paths
    if: ${{ !cancelled() && (needs.gctx-paths.result != 'success' || fromJSON(needs.gctx-paths.outputs.changes).go) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -trimpath ./cmd/gctx
